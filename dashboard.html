<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Luxe Point Admin Dashboard</title><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script><style>body{margin:0;background:#090911;color:#eee;font-family:Arial}header{padding:16px 22px;border-bottom:1px solid #29293a;display:flex;justify-content:space-between}main{max-width:1200px;margin:auto;padding:28px 20px}button,input,select{font:inherit}button{cursor:pointer}.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin:20px 0}.stat,.box{background:#141421;border:1px solid #29293a;border-radius:12px;padding:18px}.stat span{color:#999;font-size:13px}.stat b{display:block;font-size:26px;margin-top:7px}.toolbar{display:flex;gap:10px;margin-bottom:12px}input,select{background:#141421;color:#eee;border:1px solid #333;padding:11px;border-radius:8px}input{flex:1}.table{overflow:auto}table{width:100%;border-collapse:collapse;min-width:850px}th,td{padding:13px;border-bottom:1px solid #29293a;text-align:left;font-size:13px}th{color:#999}.status{padding:7px;border-radius:7px;background:#0d0d18;color:#eee;border:1px solid #333}.live{color:#4ade80}.empty{text-align:center;color:#999;padding:35px}@media(max-width:750px){.stats{grid-template-columns:repeat(2,1fr)}}</style></head><body><header><b>Luxe <span style="color:#f2cd82">Point</span> ADMIN</b><div><span id="email" style="color:#999;margin-right:12px"></span><button id="logout">Logout</button></div></header><main><h1>Dashboard Pesanan</h1><p class="live">● <span id="live">LIVE</span></p><section class="stats"><div class="stat"><span>Total</span><b id="total">0</b></div><div class="stat"><span>Pending</span><b id="pending">0</b></div><div class="stat"><span>Processing</span><b id="processing">0</b></div><div class="stat"><span>Completed</span><b id="completed">0</b></div></section><div class="toolbar"><input id="search" placeholder="Cari Order ID / username..."><select id="filter"><option value="all">Semua status</option><option>pending</option><option>paid</option><option>processing</option><option>completed</option><option>cancelled</option></select></div><div class="box table"><table><thead><tr><th>Order</th><th>Username</th><th>Robux</th><th>Harga</th><th>Promo</th><th>Status</th><th>Waktu</th></tr></thead><tbody id="body"><tr><td colspan="7" class="empty">Memuat...</td></tr></tbody></table></div></main><script>const sb=supabase.createClient('https://mhhkmucsbrjwjivpsdee.supabase.co','sb_publishable_aulkO9GJvMMl1YUayD1N8w_jwJuiFOK');let orders=[];const $=id=>document.getElementById(id);const rup=n=>'Rp '+Number(n).toLocaleString('id-ID');const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));function render(){const q=$('search').value.toLowerCase(),f=$('filter').value;const a=orders.filter(o=>(!q||(`${o.order_code} ${o.roblox_username}`).toLowerCase().includes(q))&&(f==='all'||o.status===f));$('total').textContent=orders.length;$('pending').textContent=orders.filter(o=>o.status==='pending').length;$('processing').textContent=orders.filter(o=>o.status==='processing').length;$('completed').textContent=orders.filter(o=>o.status==='completed').length;if(!a.length){$('body').innerHTML='<tr><td colspan="7" class="empty">Belum ada order.</td></tr>';return}$('body').innerHTML=a.map(o=>`<tr><td><b>${esc(o.order_code)}</b></td><td>${esc(o.roblox_username)}</td><td>${Number(o.robux_amount).toLocaleString('id-ID')}</td><td>${rup(o.price)}</td><td>${esc(o.promo_code||'-')}</td><td><select class="status" data-id="${o.id}">${['pending','paid','processing','completed','cancelled'].map(s=>`<option value="${s}" ${o.status===s?'selected':''}>${s}</option>`).join('')}</select></td><td>${new Date(o.created_at).toLocaleString('id-ID')}</td></tr>`).join('');document.querySelectorAll('.status').forEach(s=>s.onchange=async()=>{const r=await sb.from('orders').update({status:s.value}).eq('id',s.dataset.id);if(r.error)alert('Gagal update status');else{const o=orders.find(x=>String(x.id)===s.dataset.id);if(o)o.status=s.value;render()}})}async function init(){const s=await sb.auth.getSession();if(!s.data.session)return location.href='index.html';$('email').textContent=s.data.session.user.email||'';const a=await sb.from('admin_users').select('user_id').eq('user_id',s.data.session.user.id).maybeSingle();if(a.error||!a.data){await sb.auth.signOut();return location.href='index.html'}const r=await sb.from('orders').select('*').order('created_at',{ascending:false});if(r.error){$('body').innerHTML='<tr><td colspan="7" class="empty">Gagal memuat order. Pastikan RLS sudah dijalankan.</td></tr>';return}orders=r.data||[];render();sb.channel('orders-live').on('postgres_changes',{event:'*',schema:'public',table:'orders'},p=>{if(p.eventType==='INSERT')orders.unshift(p.new);if(p.eventType==='UPDATE'){const i=orders.findIndex(x=>x.id===p.new.id);if(i>=0)orders[i]=p.new}if(p.eventType==='DELETE')orders=orders.filter(x=>x.id!==p.old.id);render()}).subscribe(st=>{$('live').textContent=st==='SUBSCRIBED'?'LIVE':'OFFLINE'})}$('search').oninput=render;$('filter').onchange=render;$('logout').onclick=async()=>{await sb.auth.signOut();location.href='index.html'};init();</script></body></html>
